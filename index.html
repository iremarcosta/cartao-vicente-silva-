<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vicente Silva | Porto Real Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0b0b0c;
    --black-2: #141416;
    --gold: #c9a24b;
    --gold-light: #e9d08a;
    --gold-dim: #8a6f34;
    --cream: #f3ede0;
    --grey: #9a968c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: radial-gradient(circle at 50% -10%, #1c1a14 0%, #0b0b0c 55%, #050505 100%);
    font-family:'Montserrat', sans-serif;
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }
  .card{
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, #141416 0%, #0b0b0c 70%);
    border: 1px solid rgba(201,162,75,0.35);
    border-radius: 22px;
    padding: 40px 28px 32px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-120px; left:50%;
    width: 340px; height: 340px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(201,162,75,0.18) 0%, rgba(201,162,75,0) 70%);
    pointer-events:none;
  }
  .badge{
    width: 128px; height: 128px;
    margin: 0 auto 22px;
    border-radius: 50%;
    padding: 5px;
    background: conic-gradient(from 180deg, var(--gold-dim), var(--gold-light), var(--gold), var(--gold-dim));
    position: relative;
    animation: rotate 14s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .badge{ animation:none; } }
  .badge-inner{
    width:100%; height:100%;
    border-radius:50%;
    background:#050505;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .badge-inner img{
    width: 92%; height:92%;
    object-fit: contain;
    animation: counter-rotate 14s linear infinite;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes counter-rotate { to { transform: rotate(-360deg); } }
  @media (prefers-reduced-motion: reduce){ .badge-inner img{ animation:none; } }

  .name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 32px;
    letter-spacing: 0.5px;
    text-align:center;
    color:#fbf7ec;
  }
  .role{
    text-align:center;
    font-size: 12.5px;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-top: 6px;
    font-weight:600;
  }
  .creci{
    text-align:center;
    font-size: 11.5px;
    color: var(--grey);
    margin-top: 3px;
    letter-spacing: 1px;
  }

  .divider{
    height:1px;
    margin: 24px 0 20px;
    background: linear-gradient(90deg, transparent, rgba(201,162,75,0.55), transparent);
  }

  .rows{ display:flex; flex-direction:column; gap:13px; margin-bottom: 22px; }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color: var(--cream);
    font-size: 13.5px;
    padding: 4px 2px;
    transition: transform .15s ease, color .15s ease;
  }
  .row:hover{ color: var(--gold-light); transform: translateX(2px); }
  .row .icon{
    width: 30px; height:30px;
    min-width:30px;
    border-radius:50%;
    background: rgba(201,162,75,0.10);
    border: 1px solid rgba(201,162,75,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .row .icon svg{ width:15px; height:15px; fill:var(--gold-light); }
  .row span{ line-height:1.35; word-break: break-word; }

  .agency{
    text-align:center;
    margin-bottom: 20px;
  }
  .agency-name{
    font-family:'Cormorant Garamond', serif;
    font-size: 21px;
    font-weight:600;
    letter-spacing: 3px;
    color: var(--gold-light);
    text-transform: uppercase;
  }
  .agency-tag{
    font-size: 9.5px;
    letter-spacing: 2.5px;
    color: var(--grey);
    text-transform: uppercase;
    margin-top: 3px;
  }
  .agency-creci{
    font-size: 10.5px;
    color: var(--grey);
    margin-top: 6px;
    letter-spacing:0.5px;
  }

  .social{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin-bottom: 6px;
  }
  .social a{
    width: 42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,162,75,0.45);
    text-decoration:none;
    transition: all .18s ease;
  }
  .social a:hover{
    background: var(--gold);
    border-color: var(--gold);
    transform: translateY(-3px);
  }
  .social a svg{ width:18px; height:18px; fill: var(--gold-light); transition: fill .18s ease; }
  .social a:hover svg{ fill:#0b0b0c; }

  .footer-line{
    margin-top: 24px;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-light), var(--gold-dim));
  }

  .save-btn{
    display:block;
    text-align:center;
    margin-top: 22px;
    padding: 13px;
    border-radius: 30px;
    background: linear-gradient(120deg, var(--gold-dim), var(--gold), var(--gold-light));
    color:#0b0b0c;
    font-weight:700;
    font-size: 12.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration:none;
    box-shadow: 0 10px 24px -8px rgba(201,162,75,0.5);
  }
</style>
</head>
